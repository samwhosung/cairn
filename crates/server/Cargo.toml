[package]
name = "server"
description = "The world server: a 20 Hz bulk-synchronous tick that checks and relays movement, over TCP or in-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol = { path = "../protocol" }
rayon = "1.12"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
] }

[dev-dependencies]
libm = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["time"] }

[lints]
workspace = true
