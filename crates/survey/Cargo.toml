[package]
name = "survey"
description = "What the maps of a World of Warcraft 1.12.1 install paint and place, by zone: every ground texture, doodad and building, with where and how often, written out as text and pictures an agent can search and look through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atlas = { path = "../atlas" }
blp = { path = "../blp" }
dbc = { path = "../dbc" }
image = { version = "0.25", default-features = false, features = ["png"] }
light = { path = "../light" }
m2 = { path = "../m2" }
model = { path = "../model" }
mpq = { path = "../mpq" }
rayon = "1.12"
terrain = { path = "../terrain" }
wdt = { path = "../wdt" }

[lints]
workspace = true
