[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste`: unmaintained, no vulnerability; wgpu's Metal backend builds it through `metal`.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  # `encase`, which Bevy lays out GPU buffers with: MIT without the attribution clause.
  "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
