[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste`: unmaintained, no vulnerability; wgpu's Metal backend builds it through `metal`.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  # `encase`, which Bevy lays out GPU buffers with: MIT without the attribution clause.
  "MIT-0",
]
exceptions = [
  # kira's decoders and its parameter buffer. MPL-2.0 binds changes to their own files only, and
  # cairn uses them as published.
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-bundle-mp3" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-adpcm" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-pcm" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-core" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-format-riff" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-metadata" },
  { allow = [
    "MPL-2.0",
  ], crate = "triple_buffer" },
  # `assert_no_alloc`, which aborts a debug build that allocates on the audio thread: BSD with
  # only the notice clause.
  { allow = [
    "BSD-1-Clause",
  ], crate = "assert_no_alloc" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
