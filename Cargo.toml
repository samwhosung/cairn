[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# Bevy's defaults would also build audio, UI, glTF, gamepads, picking and more that nothing here uses.
[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "x11",
  "bevy_pbr",
  "png",
] }
# Collision queries only: the scene, picking, gizmo and mesh-collider features would pull in Bevy
# features nothing here uses.
avian3d = { version = "0.6.1", default-features = false, features = [
  "3d",
  "f32",
  "parry-f32",
  "parallel",
] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = 1
